<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mansion Mystery 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
        }

        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .game-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 100;
            pointer-events: none;
        }

        .click-to-start {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="game-ui">
            <h2>Mansion Mystery</h2>
            <p>Current Location: Entrance Hall</p>
        </div>
        <div class="click-to-start">
            <h1>Click to Start</h1>
            <p>Use WASD to move</p>
            <p>Mouse to look around</p>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
