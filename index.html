<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mansion Mystery 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            pointer-events: none;
        }

        #inventory {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            color: white;
            display: flex;
            gap: 10px;
        }

        .inventory-item {
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        #interaction-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-overlay">
            <h2>Mansion Mystery</h2>
            <p id="location-info">Current Location: Entrance Hall</p>
        </div>
        <div id="inventory">
            <div class="inventory-item">Empty</div>
        </div>
        <div id="interaction-prompt">Press E to interact</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
