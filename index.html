<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mansion Mystery - 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
            pointer-events: none;
        }
        #inventory-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
        }
        #interaction-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        .menu-option {
            cursor: pointer;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
        }
        .menu-option:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="ui-overlay">
            <h2>Current Location: <span id="location-name">Entrance Hall</span></h2>
            <p id="turns-remaining">Turns remaining: 20</p>
        </div>
        <div id="inventory-panel">
            <h3>Inventory</h3>
            <div id="inventory-items"></div>
        </div>
        <div id="interaction-menu">
            <h3>Actions</h3>
            <div class="menu-option" onclick="game.lookAround()">Look Around</div>
            <div class="menu-option" onclick="game.checkInventory()">Check Inventory</div>
            <div class="menu-option" onclick="game.talkToSuspect()">Talk to Someone</div>
            <div class="menu-option" onclick="game.makeAccusation()">Make Accusation</div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
